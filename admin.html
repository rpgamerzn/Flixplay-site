<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flixplay Admin - Content Management Panel</title>
    <link rel="icon" type="image/png" href="logo.png">

    <!-- Font Awesome 6.5.1 CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Firebase 9.22.0 Compat SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
        /* =========================================
           CSS VARIABLES & THEME DEFINITIONS
        ========================================= */
        :root {
            --bg-primary: #141414;
            --bg-secondary: #1f1f1f;
            --bg-card: #2a2a2a;
            --bg-input: #1a1a1a;
            --accent: #e50914;
            --accent-hover: #f40612;
            --text-primary: #e5e5e5;
            --text-secondary: #999999;
            --border-color: #383838;
            --shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
            --success: #2ecc71;
            --success-bg: rgba(46, 204, 113, 0.15);
            --info: #3498db;
            --info-bg: rgba(52, 152, 219, 0.15);
            --danger: #e74c3c;
            --danger-bg: rgba(231, 76, 60, 0.15);
            --warning: #f39c12;
            --highlight-bg: rgba(229, 9, 20, 0.35);
            --radius: 8px;
            --transition: all 0.25s ease;
        }

        [data-theme="light"] {
            --bg-primary: #f4f5f7;
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --bg-input: #f9fafb;
            --accent: #d80813;
            --accent-hover: #b80610;
            --text-primary: #1a1a1a;
            --text-secondary: #595959;
            --border-color: #dcdcdc;
            --shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
            --success: #1e8449;
            --success-bg: rgba(30, 132, 73, 0.12);
            --info: #1f618d;
            --info-bg: rgba(31, 97, 141, 0.12);
            --danger: #c0392b;
            --danger-bg: rgba(192, 57, 43, 0.12);
            --warning: #b7791f;
            --highlight-bg: rgba(216, 8, 19, 0.2);
        }

        /* =========================================
           BASE RESET & ACCESSIBILITY
        ========================================= */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.5;
            min-height: 100vh;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        :focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .hidden {
            display: none !important;
        }

        /* =========================================
           LOADING SCREEN
        ========================================= */
        #loadingScreen {
            position: fixed;
            inset: 0;
            background-color: var(--bg-primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            gap: 16px;
        }

        .loading-logo {
            height: 48px;
            width: auto;
            object-fit: contain;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid var(--border-color);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* =========================================
           HEADER SECTION
        ========================================= */
        .app-header {
            position: sticky;
            top: 0;
            z-index: 100;
            background-color: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: 0.3px;
        }

        .brand-logo {
            height: 36px;
            width: auto;
            max-width: 150px;
            object-fit: contain;
            display: block;
            transition: filter 0.25s ease;
        }

        .login-logo {
            height: 46px;
            width: auto;
            max-width: 200px;
            object-fit: contain;
            display: block;
            margin: 0 auto 12px;
            transition: filter 0.25s ease;
        }

        /* Keeps white "Flix" text readable in light mode */
        [data-theme="light"] .brand-logo,
        [data-theme="light"] .login-logo,
        [data-theme="light"] .loading-logo {
            filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.45));
        }

        .brand span.badge {
            font-size: 0.7rem;
            background-color: var(--accent);
            color: #ffffff;
            padding: 2px 8px;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* =========================================
           BUTTONS
        ========================================= */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 44px;
            padding: 10px 18px;
            font-size: 0.95rem;
            font-weight: 600;
            border: none;
            border-radius: var(--radius);
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
            color: #ffffff;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-primary {
            background-color: var(--accent);
        }

        .btn-primary:hover:not(:disabled) {
            background-color: var(--accent-hover);
        }

        .btn-secondary {
            background-color: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover:not(:disabled) {
            background-color: var(--border-color);
        }

        .btn-success {
            background-color: var(--success);
            color: #ffffff;
        }

        .btn-success:hover:not(:disabled) {
            filter: brightness(1.1);
        }

        .btn-danger {
            background-color: var(--danger);
            color: #ffffff;
        }

        .btn-danger:hover:not(:disabled) {
            filter: brightness(1.1);
        }

        .btn-icon {
            width: 44px;
            height: 44px;
            padding: 0;
            background-color: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-icon:hover:not(:disabled) {
            border-color: var(--accent);
            color: var(--accent);
        }

        .btn-sm {
            min-height: 38px;
            padding: 6px 14px;
            font-size: 0.85rem;
        }

        /* =========================================
           LOGIN SECTION
        ========================================= */
        #loginSection {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: radial-gradient(circle at top, rgba(229, 9, 20, 0.15), transparent 60%);
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 32px 28px;
            box-shadow: var(--shadow);
        }

        .login-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .login-header h1 {
            font-size: 1.35rem;
            margin-bottom: 6px;
        }

        .login-header p {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        /* =========================================
           MAIN DASHBOARD LAYOUT
        ========================================= */
        .dashboard-container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 24px 16px 60px;
            display: flex;
            flex-direction: column;
            gap: 28px;
        }

        .panel-section {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            box-shadow: var(--shadow);
            transition: var(--transition);
        }

        .section-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 20px;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--border-color);
        }

        .section-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.25rem;
            font-weight: 700;
        }

        .section-title i {
            color: var(--accent);
        }

        .count-pill {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            font-size: 0.8rem;
            padding: 2px 10px;
            border-radius: 999px;
            font-weight: 600;
        }

        /* =========================================
           FORMS & INPUTS
        ========================================= */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        label {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        label .required {
            color: var(--accent);
            margin-left: 2px;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="url"],
        select,
        textarea {
            width: 100%;
            min-height: 44px;
            padding: 10px 14px;
            font-size: 16px; /* Prevents iOS auto-zoom */
            font-family: inherit;
            color: var(--text-primary);
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(229, 9, 20, 0.2);
        }

        textarea {
            min-height: 110px;
            resize: vertical;
        }

        .helper-text {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .form-actions {
            grid-column: 1 / -1;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 6px;
        }

        /* Status Messages */
        .status-message {
            padding: 12px 16px;
            border-radius: var(--radius);
            font-size: 0.92rem;
            font-weight: 500;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            animation: fadeIn 0.25s ease;
        }

        .status-message.success {
            background-color: var(--success-bg);
            color: var(--success);
            border: 1px solid var(--success);
        }

        .status-message.error {
            background-color: var(--danger-bg);
            color: var(--danger);
            border: 1px solid var(--danger);
        }

        .status-message.warning {
            background-color: rgba(243, 156, 18, 0.15);
            color: var(--warning);
            border: 1px solid var(--warning);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* =========================================
           SEARCH BAR & MANAGE MOVIES
        ========================================= */
        .search-wrapper {
            position: relative;
            width: 100%;
            max-width: 360px;
        }

        .search-wrapper input {
            padding-left: 40px;
            padding-right: 36px;
        }

        .search-wrapper .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            pointer-events: none;
        }

        .search-wrapper .clear-search {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        .search-wrapper .clear-search:hover {
            color: var(--text-primary);
            background-color: var(--border-color);
        }

        .movies-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 16px;
        }

        .movie-card {
            display: flex;
            gap: 16px;
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 14px;
            transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
        }

        @media (hover: hover) {
            .movie-card:hover {
                transform: translateY(-3px);
                box-shadow: var(--shadow);
                border-color: var(--text-secondary);
            }
        }

        .movie-poster {
            width: 80px;
            height: 120px;
            object-fit: cover;
            border-radius: 6px;
            flex-shrink: 0;
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
        }

        .movie-info {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 8px;
        }

        .movie-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text-primary);
            word-break: break-word;
        }

        .movie-meta {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            font-size: 0.82rem;
            color: var(--text-secondary);
        }

        .genre-tag {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .rating-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            color: #f1c40f;
            font-weight: 600;
        }

        .url-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .link-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 4px;
            text-decoration: none;
        }

        .badge-play {
            background-color: var(--info-bg);
            color: var(--info);
            border: 1px solid rgba(52, 152, 219, 0.3);
        }

        .badge-download {
            background-color: var(--success-bg);
            color: var(--success);
            border: 1px solid rgba(46, 204, 113, 0.3);
        }

        .movie-desc {
            font-size: 0.85rem;
            color: var(--text-secondary);
            line-height: 1.4;
        }

        .movie-actions {
            display: flex;
            gap: 8px;
            margin-top: 4px;
        }

        .movie-actions .btn {
            flex: 1;
        }

        mark.highlight {
            background-color: var(--highlight-bg);
            color: var(--text-primary);
            padding: 0 2px;
            border-radius: 2px;
        }

        /* =========================================
           BROKEN LINK REPORTS
        ========================================= */
        .reports-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .report-card {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-left: 4px solid var(--warning);
            border-radius: 8px;
            padding: 14px 18px;
        }

        .report-details {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .report-movie-title {
            font-weight: 700;
            font-size: 1rem;
            color: var(--text-primary);
        }

        .report-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            font-size: 0.82rem;
            color: var(--text-secondary);
        }

        .report-meta span {
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        /* =========================================
           EMPTY STATES
        ========================================= */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
            border: 1px dashed var(--border-color);
            border-radius: 10px;
        }

        .empty-state i {
            font-size: 2.5rem;
            margin-bottom: 12px;
            opacity: 0.6;
        }

        .empty-state p {
            font-size: 0.95rem;
        }

        /* =========================================
           TOAST NOTIFICATIONS
        ========================================= */
        #toastContainer {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 2000;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: calc(100vw - 32px);
        }

        .toast {
            display: flex;
            align-items: center;
            gap: 10px;
            background-color: var(--bg-secondary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            border-left: 4px solid var(--accent);
            padding: 12px 18px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            font-size: 0.92rem;
            font-weight: 500;
            animation: slideInRight 0.25s ease;
        }

        .toast.success { border-left-color: var(--success); }
        .toast.error { border-left-color: var(--danger); }

        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(30px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* =========================================
           CONFIRMATION MODAL
        ========================================= */
        .modal-backdrop {
            position: fixed;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.75);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 3000;
        }

        .confirm-modal {
            width: 100%;
            max-width: 400px;
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            box-shadow: var(--shadow);
            animation: fadeIn 0.2s ease;
        }

        .confirm-modal h3 {
            font-size: 1.15rem;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .confirm-modal h3 i {
            color: var(--danger);
        }

        .confirm-modal p {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-bottom: 20px;
        }

        .confirm-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        /* =========================================
           RESPONSIVE BREAKPOINTS
        ========================================= */
        @media (max-width: 768px) {
            .app-header {
                padding: 10px 14px;
            }

            .brand-logo {
                height: 28px;
                max-width: 120px;
            }

            .brand span.badge {
                display: none;
            }

            .dashboard-container {
                padding: 16px 12px 48px;
                gap: 20px;
            }

            .panel-section {
                padding: 16px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .search-wrapper {
                max-width: 100%;
            }

            .movies-list {
                grid-template-columns: 1fr;
            }

            .btn-logout-text {
                display: none;
            }

            #toastContainer {
                bottom: 16px;
                right: 16px;
                left: 16px;
            }
        }
    </style>
</head>
<body>

    <!-- Loading Screen -->
    <div id="loadingScreen" role="status" aria-live="polite">
        <img src="logo.png" alt="Flixplay" class="loading-logo" onerror="this.style.display='none'">
        <div class="spinner"></div>
        <p>Initializing Admin Panel...</p>
    </div>

    <!-- Admin Login View -->
    <section id="loginSection" class="hidden" aria-label="Admin Login">
        <div class="login-card">
            <div class="login-header">
                <img
                    src="logo.png"
                    alt="Flixplay"
                    class="login-logo"
                    onerror="this.classList.add('hidden'); this.nextElementSibling.classList.remove('hidden');"
                >
                <!-- Fallback inline SVG matching the Flixplay logo if logo.png is missing -->
                <svg class="login-logo hidden" viewBox="0 0 210 52" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Flixplay">
                    <path d="M12 6C12 3.5 14 2 16.5 2H46L41 13H22V21H38L34 31H22V44L12 50V6Z" fill="#e50914"/>
                    <path d="M12 6C15 2 20 2 24 2L19 13H12V6Z" fill="#9e040c"/>
                    <text x="52" y="37" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="31" letter-spacing="-0.5">
                        <tspan fill="var(--text-primary)">Flix</tspan><tspan fill="#e50914">play</tspan>
                    </text>
                </svg>
                <h1>Admin Panel</h1>
                <p>Sign in to manage movies and reports</p>
            </div>

            <div id="loginMessage" class="status-message hidden" role="alert"></div>

            <form id="loginForm" novalidate>
                <div class="form-group" style="margin-bottom: 16px;">
                    <label for="loginEmail">Email Address <span class="required">*</span></label>
                    <input type="email" id="loginEmail" required autocomplete="email" placeholder="admin@example.com">
                </div>

                <div class="form-group" style="margin-bottom: 20px;">
                    <label for="loginPassword">Password <span class="required">*</span></label>
                    <input type="password" id="loginPassword" required autocomplete="current-password" placeholder="Enter your password">
                </div>

                <button type="submit" id="loginSubmitBtn" class="btn btn-primary" style="width: 100%;">
                    <i class="fas fa-sign-in-alt" aria-hidden="true"></i>
                    <span>Sign In</span>
                </button>
            </form>
        </div>
    </section>

    <!-- Main Dashboard View -->
    <div id="dashboardWrapper" class="hidden">
        <!-- Sticky Header -->
        <header class="app-header">
            <div class="brand">
                <img
                    src="logo.png"
                    alt="Flixplay"
                    class="brand-logo"
                    onerror="this.classList.add('hidden'); this.nextElementSibling.classList.remove('hidden');"
                >
                <!-- Fallback inline SVG matching the Flixplay logo if logo.png is missing -->

        <main class="dashboard-container">

    <!-- Reusable Confirmation Modal -->
    <div id="confirmModal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">

    <!-- Toast Notification Container -->
    <div id="toastContainer" aria-live="polite"></div>

    <script>
        /* =========================================================
           FIREBASE CONFIGURATION
        ========================================================= */
        const firebaseConfig = {
            apiKey: "AIzaSyDOXZG58pVwtqGs4UwghXP_U7ZZhpt4TCY",
            authDomain: "flixplay-movie.firebaseapp.com",
            databaseURL: "https://flixplay-movie-default-rtdb.firebaseio.com",
            projectId: "flixplay-movie",
            storageBucket: "flixplay-movie.firebasestorage.app",
            messagingSenderId: "1081716032192",
            appId: "1:1081716032192:web:7dac31b7024ab407c72325"
        };

        /* =========================================================
           GLOBAL VARIABLES
        ========================================================= */
        let auth = null;
        let database = null;
        let allMovies = [];
        let allReports = [];
        let currentUser = null;
        let moviesRef = null;
        let reportsRef = null;
        let searchDebounceTimer = null;
        let confirmCallback = null;

        // Inline SVG fallback for broken poster images
        const FALLBACK_POSTER = "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(
            `<svg xmlns="http://www.w3.org/2000/svg" width="80" height="120" viewBox="0 0 80 120">
                <rect width="80" height="120" fill="#1f1f1f"/>
                <text x="50%" y="50%" fill="#777" font-family="sans-serif" font-size="11" text-anchor="middle" dy=".3em">No Poster</text>
            </svg>`
        );

        /* =========================================================
           INITIALIZATION FUNCTIONS
        ========================================================= */
        function initializeFirebase() {
            const loadingScreen = document.getElementById('loadingScreen');

            if (!firebaseConfig.apiKey || firebaseConfig.apiKey === "YOUR_API_KEY") {
                loadingScreen.classList.add('hidden');
                document.getElementById('loginSection').classList.remove('hidden');
                showStatusMessage(
                    'loginMessage',
                    'Firebase is not configured yet. Please replace placeholder credentials in firebaseConfig.',
                    'warning'
                );
                return;
            }

            try {
                if (!firebase.apps.length) {
                    firebase.initializeApp(firebaseConfig);
                }
                auth = firebase.auth();
                database = firebase.database();

                auth.onAuthStateChanged((user) => {
                    loadingScreen.classList.add('hidden');
                    currentUser = user;

                    if (user) {
                        showDashboard();
                        loadMovies();
                        loadReports();
                    } else {
                        detachDatabaseListeners();
                        showLogin();
                    }
                });
            } catch (error) {
                console.error("Firebase initialization failed:", error);
                loadingScreen.classList.add('hidden');
                showLogin();
                showStatusMessage('loginMessage', `Firebase Error: ${error.message}`, 'error');
            }
        }

        function initializeTheme() {
            const savedTheme = localStorage.getItem('theme') || 'dark';
            applyTheme(savedTheme);
        }

        /* =========================================================
           AUTHENTICATION FUNCTIONS
        ========================================================= */
        async function login(event) {
            event.preventDefault();
            clearStatusMessage('loginMessage');

            if (!auth) {
                showStatusMessage('loginMessage', 'Configure Firebase credentials before signing in.', 'error');
                return;
            }

            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            const submitBtn = document.getElementById('loginSubmitBtn');

            if (!email || !password) {
                showStatusMessage('loginMessage', 'Please enter both email and password.', 'error');
                return;
            }

            try {
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i><span>Signing In...</span>';
                await auth.signInWithEmailAndPassword(email, password);
                showToast('Logged in successfully!', 'success');
                document.getElementById('loginForm').reset();
            } catch (error) {
                console.error("Login error:", error);
                showStatusMessage('loginMessage', getFriendlyAuthError(error), 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i><span>Sign In</span>';
            }
        }

        async function logout() {
            if (!auth) return;
            try {
                await auth.signOut();
                showToast('Logged out successfully.', 'success');
            } catch (error) {
                console.error("Logout error:", error);
                showToast('Failed to log out. Please try again.', 'error');
            }
        }

        /* =========================================================
           DATA LOADING FUNCTIONS (REAL-TIME FIREBASE)
        ========================================================= */
        function loadMovies() {
            if (!database) return;

            moviesRef = database.ref('movies');
            moviesRef.on('value', (snapshot) => {
                const data = snapshot.val();
                allMovies = [];

                if (data) {
                    Object.keys(data).forEach((key) => {
                        allMovies.push({
                            id: key,
                            ...data[key]
                        });
                    });
                    allMovies.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
                }

                filterMovies();
            }, (error) => {
                console.error("Error loading movies:", error);
                showToast('Failed to load movies from database.', 'error');
            });
        }

        function loadReports() {
            if (!database) return;

            reportsRef = database.ref('reports');
            reportsRef.on('value', (snapshot) => {
                const data = snapshot.val();
                allReports = [];

                if (data) {
                    Object.keys(data).forEach((key) => {
                        allReports.push({
                            id: key,
                            ...data[key]
                        });
                    });
                    allReports.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
                }

                displayReports(allReports);
            }, (error) => {
                console.error("Error loading reports:", error);
                showToast('Failed to load broken link reports.', 'error');
            });
        }

        function detachDatabaseListeners() {
            if (moviesRef) {
                moviesRef.off();
                moviesRef = null;
            }
            if (reportsRef) {
                reportsRef.off();
                reportsRef = null;
            }
        }

        /* =========================================================
           MOVIE CRUD OPERATIONS
        ========================================================= */
        async function handleMovieSubmit(event) {
            event.preventDefault();
            clearStatusMessage('formMessage');

            if (!database) return;

            const editId = document.getElementById('editMovieId').value.trim();
            const title = document.getElementById('movieTitle').value.trim();
            const genre = document.getElementById('movieGenre').value.trim();
            const poster = document.getElementById('moviePoster').value.trim();
            const playUrl = document.getElementById('moviePlayUrl').value.trim();
            const downloadUrl = document.getElementById('movieDownloadUrl').value.trim();
            const description = document.getElementById('movieDescription').value.trim();

            if (!title || !genre || !poster || !playUrl || !downloadUrl || !description) {
                showStatusMessage('formMessage', 'Please fill out all required fields.', 'error');
                return;
            }

            if (!isValidHttpUrl(poster) || !isValidHttpUrl(playUrl) || !isValidHttpUrl(downloadUrl)) {
                showStatusMessage('formMessage', 'Please enter valid http:// or https:// URLs for Poster, Play Online, and Download links.', 'error');
                return;
            }

            const submitBtn = document.getElementById('movieSubmitBtn');
            submitBtn.disabled = true;

            try {
                if (editId) {
                    const existing = allMovies.find(m => m.id === editId);
                    const updatedData = {
                        title,
                        genre,
                        poster,
                        playUrl,
                        downloadUrl,
                        description,
                        timestamp: existing && existing.timestamp ? existing.timestamp : Date.now(),
                        ratingTotal: existing && typeof existing.ratingTotal === 'number' ? existing.ratingTotal : 0,
                        ratingCount: existing && typeof existing.ratingCount === 'number' ? existing.ratingCount : 0
                    };

                    await database.ref(`movies/${editId}`).update(updatedData);
                    showStatusMessage('formMessage', `"${title}" updated successfully!`, 'success');
                    showToast('Movie updated successfully!', 'success');
                    resetMovieForm();
                } else {
                    const newMovieData = {
                        title,
                        genre,
                        poster,
                        playUrl,
                        downloadUrl,
                        description,
                        timestamp: Date.now(),
                        ratingTotal: 0,
                        ratingCount: 0
                    };

                    await database.ref('movies').push(newMovieData);
                    showStatusMessage('formMessage', `"${title}" added successfully!`, 'success');
                    showToast('Movie added successfully!', 'success');
                    document.getElementById('movieForm').reset();
                }
            } catch (error) {
                console.error("Save movie error:", error);
                showStatusMessage('formMessage', `Failed to save movie: ${error.message}`, 'error');
                showToast('Error saving movie.', 'error');
            } finally {
                submitBtn.disabled = false;
            }
        }

        function startEditMovie(movieId) {
            const movie = allMovies.find(m => m.id === movieId);
            if (!movie) return;

            document.getElementById('editMovieId').value = movie.id;
            document.getElementById('movieTitle').value = movie.title || '';
            document.getElementById('movieGenre').value = movie.genre || '';
            document.getElementById('moviePoster').value = movie.poster || '';
            document.getElementById('moviePlayUrl').value = movie.playUrl || '';
            document.getElementById('movieDownloadUrl').value = movie.downloadUrl || '';
            document.getElementById('movieDescription').value = movie.description || '';

            document.getElementById('formTitleText').textContent = 'Edit Movie';
            document.getElementById('formTitleIcon').className = 'fas fa-edit';
            document.getElementById('submitBtnText').textContent = 'Update Movie';
            document.getElementById('movieSubmitBtn').querySelector('i').className = 'fas fa-save';
            document.getElementById('cancelEditBtn').classList.remove('hidden');

            clearStatusMessage('formMessage');
            document.getElementById('movieFormSection').scrollIntoView({ behavior: 'smooth' });
            document.getElementById('movieTitle').focus();
        }

        function resetMovieForm() {
            document.getElementById('movieForm').reset();
            document.getElementById('editMovieId').value = '';
            document.getElementById('formTitleText').textContent = 'Add New Movie';
            document.getElementById('formTitleIcon').className = 'fas fa-plus-circle';
            document.getElementById('submitBtnText').textContent = 'Add Movie';
            document.getElementById('movieSubmitBtn').querySelector('i').className = 'fas fa-plus';
            document.getElementById('cancelEditBtn').classList.add('hidden');
        }

        function requestDeleteMovie(movieId, movieTitle) {
            openConfirmModal(
                'Delete Movie',
                `Are you sure you want to permanently delete "${movieTitle}"? This action cannot be undone.`,
                async () => {
                    try {
                        await database.ref(`movies/${movieId}`).remove();
                        if (document.getElementById('editMovieId').value === movieId) {
                            resetMovieForm();
                        }
                        showToast(`"${movieTitle}" deleted.`, 'success');
                    } catch (error) {
                        console.error("Delete movie error:", error);
                        showToast('Failed to delete movie.', 'error');
                    }
                }
            );
        }

        function requestResolveReport(reportId, movieTitle) {
            openConfirmModal(
                'Resolve Report',
                `Mark the broken link report for "${movieTitle || 'this movie'}" as resolved and remove it?`,
                async () => {
                    try {
                        await database.ref(`reports/${reportId}`).remove();
                        showToast('Report resolved and removed.', 'success');
                    } catch (error) {
                        console.error("Resolve report error:", error);
                        showToast('Failed to resolve report.', 'error');
                    }
                }
            );
        }

        /* =========================================================
           UI RENDERING FUNCTIONS
        ========================================================= */
        function showLogin() {
            document.getElementById('dashboardWrapper').classList.add('hidden');
            document.getElementById('loginSection').classList.remove('hidden');
        }

        function showDashboard() {
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('dashboardWrapper').classList.remove('hidden');
        }

        function displayMovies(movies, searchQuery = '') {
            const container = document.getElementById('moviesListContainer');
            const countPill = document.getElementById('moviesCount');
            countPill.textContent = movies.length;

            if (movies.length === 0) {
                const emptyText = searchQuery
                    ? `No movies matched "${escapeHtml(searchQuery)}".`
                    : 'No movies added yet. Use the form above to add your first movie!';
                container.innerHTML = `
                    <div class="empty-state" style="grid-column: 1 / -1;">
                        <i class="fas fa-film" aria-hidden="true"></i>
                        <p>${emptyText}</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = movies.map((movie) => {
                const avgRating = movie.ratingCount > 0
                    ? (movie.ratingTotal / movie.ratingCount).toFixed(1)
                    : '0.0';

                const rawDesc = movie.description || '';
                const previewDesc = rawDesc.length > 100 ? rawDesc.slice(0, 100) + '...' : rawDesc;

                const safePoster = isValidHttpUrl(movie.poster) ? escapeHtml(movie.poster) : FALLBACK_POSTER;
                const safePlayUrl = isValidHttpUrl(movie.playUrl) ? escapeHtml(movie.playUrl) : '#';
                const safeDownloadUrl = isValidHttpUrl(movie.downloadUrl) ? escapeHtml(movie.downloadUrl) : '#';

                return `
                    <article class="movie-card">
                        <img
                            src="${safePoster}"
                            alt="${escapeHtml(movie.title)} poster"
                            class="movie-poster"
                            loading="lazy"
                            onerror="this.onerror=null;this.src='${FALLBACK_POSTER}';"
                        >
                        <div class="movie-info">
                            <div>
                                <h3 class="movie-title">${highlightText(movie.title || 'Untitled', searchQuery)}</h3>
                                <div class="movie-meta" style="margin-top: 4px;">
                                    <span class="genre-tag">${highlightText(movie.genre || 'General', searchQuery)}</span>
                                    <span class="rating-badge" title="${movie.ratingCount || 0} votes">
                                        <i class="fas fa-star" aria-hidden="true"></i>
                                        <span>${avgRating}</span>
                                    </span>
                                </div>
                            </div>

                            <div class="url-badges">
                                <a href="${safePlayUrl}" target="_blank" rel="noopener noreferrer" class="link-badge badge-play" title="Open streaming URL">
                                    <i class="fas fa-play" aria-hidden="true"></i>
                                    <span>Play Online</span>
                                </a>
                                <a href="${safeDownloadUrl}" target="_blank" rel="noopener noreferrer" class="link-badge badge-download" title="Open download URL">
                                    <i class="fas fa-download" aria-hidden="true"></i>
                                    <span>Download</span>
                                </a>
                            </div>

                            <p class="movie-desc">${escapeHtml(previewDesc)}</p>

                            <div class="movie-actions">
                                <button type="button" class="btn btn-success btn-sm" onclick="startEditMovie('${escapeHtml(movie.id)}')" aria-label="Edit ${escapeHtml(movie.title)}">
                                    <i class="fas fa-edit" aria-hidden="true"></i>
                                    <span>Edit</span>
                                </button>
                                <button type="button" class="btn btn-danger btn-sm" onclick="requestDeleteMovie('${escapeHtml(movie.id)}', '${escapeJsString(movie.title)}')" aria-label="Delete ${escapeHtml(movie.title)}">
                                    <i class="fas fa-trash" aria-hidden="true"></i>
                                    <span>Delete</span>
                                </button>
                            </div>
                        </div>
                    </article>
                `;
            }).join('');
        }

        function displayReports(reports) {
            const container = document.getElementById('reportsListContainer');
            const countPill = document.getElementById('reportsCount');
            countPill.textContent = reports.length;

            if (reports.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-check-circle" aria-hidden="true"></i>
                        <p>No broken link reports right now. All links look healthy!</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = reports.map((report) => {
                const formattedDate = report.timestamp
                    ? new Date(report.timestamp).toLocaleString()
                    : 'Unknown time';

                return `
                    <div class="report-card">
                        <div class="report-details">
                            <span class="report-movie-title">${escapeHtml(report.movieTitle || 'Unknown Movie')}</span>
                            <div class="report-meta">
                                <span><i class="fas fa-hashtag" aria-hidden="true"></i> Movie ID: ${escapeHtml(report.movieId || 'N/A')}</span>
                                <span><i class="fas fa-user" aria-hidden="true"></i> User: ${escapeHtml(report.userId || 'Anonymous')}</span>
                                <span><i class="fas fa-clock" aria-hidden="true"></i> ${escapeHtml(formattedDate)}</span>
                            </div>
                        </div>
                        <button type="button" class="btn btn-success btn-sm" onclick="requestResolveReport('${escapeHtml(report.id)}', '${escapeJsString(report.movieTitle || '')}')">
                            <i class="fas fa-check" aria-hidden="true"></i>
                            <span>Resolve</span>
                        </button>
                    </div>
                `;
            }).join('');
        }

        /* =========================================================
           HELPER FUNCTIONS
        ========================================================= */
        function filterMovies() {
            const input = document.getElementById('searchMoviesInput');
            const clearBtn = document.getElementById('clearSearchBtn');
            const query = input.value.trim().toLowerCase();

            clearBtn.classList.toggle('hidden', query.length === 0);

            if (!query) {
                displayMovies(allMovies, '');
                return;
            }

            const filtered = allMovies.filter((movie) => {
                const titleMatch = (movie.title || '').toLowerCase().includes(query);
                const genreMatch = (movie.genre || '').toLowerCase().includes(query);
                return titleMatch || genreMatch;
            });

            displayMovies(filtered, input.value.trim());
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme') || 'dark';
            const nextTheme = currentTheme === 'dark' ? 'light' : 'dark';
            applyTheme(nextTheme);
            localStorage.setItem('theme', nextTheme);
        }

        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            const icon = document.querySelector('#themeToggleBtn i');
            if (icon) {
                icon.className = theme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
            }
        }

        function isValidHttpUrl(str) {
            try {
                const url = new URL(str);
                return url.protocol === 'http:' || url.protocol === 'https:';
            } catch {
                return false;
            }
        }

        function escapeHtml(text) {
            if (text === null || text === undefined) return '';
            return String(text)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function escapeJsString(text) {
            if (!text) return '';
            return String(text)
                .replace(/\\/g, '\\\\')
                .replace(/'/g, "\\'")
                .replace(/"/g, '&quot;');
        }

        function highlightText(text, query) {
            if (!query) return escapeHtml(text);
            const escapedRegex = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const regex = new RegExp(`(${escapedRegex})`, 'gi');
            const parts = String(text).split(regex);

            return parts.map((part, index) => {
                if (index % 2 === 1) {
                    return `<mark class="highlight">${escapeHtml(part)}</mark>`;
                }
                return escapeHtml(part);
            }).join('');
        }

        function showStatusMessage(elementId, message, type) {
            const el = document.getElementById(elementId);
            if (!el) return;
            const iconClass = type === 'success'
                ? 'fa-check-circle'
                : type === 'warning'
                    ? 'fa-exclamation-triangle'
                    : 'fa-exclamation-circle';
            el.className = `status-message ${type}`;
            el.innerHTML = `<i class="fas ${iconClass}" aria-hidden="true"></i><span>${escapeHtml(message)}</span>`;
            el.classList.remove('hidden');
        }

        function clearStatusMessage(elementId) {
            const el = document.getElementById(elementId);
            if (el) {
                el.classList.add('hidden');
                el.innerHTML = '';
            }
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            const iconClass = type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle';
            toast.innerHTML = `<i class="fas ${iconClass}" aria-hidden="true"></i><span>${escapeHtml(message)}</span>`;
            container.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(20px)';
                toast.style.transition = 'all 0.25s ease';
                setTimeout(() => toast.remove(), 250);
            }, 3200);
        }

        function openConfirmModal(title, message, onConfirm) {
            document.getElementById('confirmTitle').textContent = title;
            document.getElementById('confirmMessage').textContent = message;
            confirmCallback = onConfirm;
            document.getElementById('confirmModal').classList.remove('hidden');
            document.getElementById('confirmProceedBtn').focus();
        }

        function closeConfirmModal() {
            document.getElementById('confirmModal').classList.add('hidden');
            confirmCallback = null;
        }

        function getFriendlyAuthError(error) {
            switch (error.code) {
                case 'auth/invalid-email':
                    return 'Please enter a valid email address.';
                case 'auth/user-disabled':
                    return 'This admin account has been disabled.';
                case 'auth/user-not-found':
                case 'auth/wrong-password':
                case 'auth/invalid-credential':
                    return 'Invalid email or password.';
                case 'auth/too-many-requests':
                    return 'Too many failed attempts. Please try again later.';
                default:
                    return error.message || 'Authentication failed.';
            }
        }

        /* =========================================================
           EVENT LISTENERS
        ========================================================= */
        window.addEventListener('DOMContentLoaded', () => {
            initializeTheme();
            initializeFirebase();

            document.getElementById('loginForm').addEventListener('submit', login);
            document.getElementById('logoutBtn').addEventListener('click', logout);

            document.getElementById('themeToggleBtn').addEventListener('click', toggleTheme);

            document.getElementById('movieForm').addEventListener('submit', handleMovieSubmit);
            document.getElementById('cancelEditBtn').addEventListener('click', () => {
                resetMovieForm();
                clearStatusMessage('formMessage');
            });

            document.getElementById('searchMoviesInput').addEventListener('input', () => {
                clearTimeout(searchDebounceTimer);
                searchDebounceTimer = setTimeout(filterMovies, 180);
            });

            document.getElementById('clearSearchBtn').addEventListener('click', () => {
                const input = document.getElementById('searchMoviesInput');
                input.value = '';
                filterMovies();
                input.focus();
            });

            document.getElementById('confirmCancelBtn').addEventListener('click', closeConfirmModal);
            document.getElementById('confirmProceedBtn').addEventListener('click', async () => {
                const cb = confirmCallback;
                closeConfirmModal();
                if (typeof cb === 'function') {
                    await cb();
                }
            });

            document.getElementById('confirmModal').addEventListener('click', (e) => {
                if (e.target.id === 'confirmModal') closeConfirmModal();
            });
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && !document.getElementById('confirmModal').classList.contains('hidden')) {
                    closeConfirmModal();
                }
            });
        });
    </script>
</body>
</html>
