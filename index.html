<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flixplay - Watch & Stream Movies</title>
    <link rel="icon" type="image/png" href="logo.png">

    <!-- Font Awesome 6.5.1 CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Firebase 9.22.0 Compat SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
        /* =========================================
           CSS VARIABLES & THEME DEFINITIONS
        ========================================= */
        :root {
            --bg-primary: #141414;
            --bg-secondary: #1f1f1f;
            --bg-card: #2a2a2a;
            --bg-input: #262626;
            --accent: #e50914;
            --accent-hover: #f40612;
            --text-primary: #e5e5e5;
            --text-secondary: #999999;
            --border-color: #363636;
            --shadow: 0 8px 24px rgba(0, 0, 0, 0.55);
            --blue: #2980b9;
            --blue-hover: #3498db;
            --green: #27ae60;
            --green-hover: #2ecc71;
            --star-color: #f1c40f;
            --radius: 10px;
            --bottom-nav-height: 64px;
            --transition: all 0.25s ease;
        }

        [data-theme="light"] {
            --bg-primary: #f4f5f7;
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --bg-input: #f0f2f5;
            --accent: #d80813;
            --accent-hover: #b80610;
            --text-primary: #1a1a1a;
            --text-secondary: #595959;
            --border-color: #dcdcdc;
            --shadow: 0 6px 18px rgba(0, 0, 0, 0.1);
            --blue: #1f618d;
            --blue-hover: #2980b9;
            --green: #1e8449;
            --green-hover: #27ae60;
        }

        /* =========================================
           BASE RESET & ACCESSIBILITY
        ========================================= */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.5;
            min-height: 100vh;
            padding-bottom: calc(var(--bottom-nav-height) + 16px);
            overflow-x: hidden;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        :focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .hidden {
            display: none !important;
        }

        /* =========================================
           LOADING SCREEN
        ========================================= */
        #loadingScreen {
            position: fixed;
            inset: 0;
            background-color: var(--bg-primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            z-index: 9999;
        }

        .loading-logo {
            height: 48px;
            width: auto;
            object-fit: contain;
        }

        .spinner {
            width: 46px;
            height: 46px;
            border: 4px solid var(--border-color);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* =========================================
           HEADER SECTION (STICKY + FULL-WIDTH SEARCH)
        ========================================= */
        .app-header {
            position: sticky;
            top: 0;
            z-index: 200;
            background-color: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .brand {
            display: flex;
            align-items: center;
            text-decoration: none;
            flex-shrink: 0;
            cursor: pointer;
        }

        .brand-logo {
            height: 36px;
            width: auto;
            max-width: 150px;
            object-fit: contain;
            display: block;
            transition: filter 0.25s ease;
        }

        /* Keeps white "Flix" text visible against light-mode header */
        [data-theme="light"] .brand-logo,
        [data-theme="light"] .loading-logo {
            filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.45));
        }

        .header-search {
            flex: 1;
            position: relative;
            min-width: 0;
        }

        .header-search input {
            width: 100%;
            height: 44px;
            padding: 8px 42px 8px 16px;
            font-size: 16px; /* Prevents iOS zoom */
            font-family: inherit;
            color: var(--text-primary);
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 999px;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .header-search input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(229, 9, 20, 0.2);
        }

        .header-search .search-icon-right {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            pointer-events: none;
            font-size: 0.95rem;
        }

        @media (max-width: 480px) {
            .app-header {
                padding: 10px 12px;
                gap: 10px;
            }

            .brand-logo {
                height: 28px;
                max-width: 120px;
            }

            .header-search input {
                height: 40px;
                padding: 6px 36px 6px 12px;
            }
        }

        /* =========================================
           MAIN CONTAINER
        ========================================= */
        .main-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 12px 16px 24px;
        }

        /* =========================================
           A. 3D ROTATING MOVIE CAROUSEL
        ========================================= */
        .carousel-section {
            position: relative;
            width: 100%;
            height: 320px;
            margin-bottom: 12px;
            perspective: 1200px;
            overflow: hidden;
            user-select: none;
            touch-action: pan-y;
        }

        @media (min-width: 768px) {
            .carousel-section {
                height: 380px;
            }
        }

        .carousel-stage {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .carousel-item {
            position: absolute;
            width: 185px;
            height: 275px;
            border-radius: 12px;
            overflow: hidden;
            background-color: var(--bg-card);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.7);
            border: 2px solid rgba(255, 255, 255, 0.08);
            cursor: pointer;
            transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1),
                        opacity 0.6s ease,
                        z-index 0s linear 0.15s;
            will-change: transform, opacity;
        }

        @media (min-width: 768px) {
            .carousel-item {
                width: 230px;
                height: 340px;
            }
        }

        .carousel-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .carousel-overlay {
            position: absolute;
            inset: auto 0 0 0;
            padding: 28px 12px 12px;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.92), rgba(0, 0, 0, 0.45) 65%, transparent);
            color: #ffffff;
        }

        .carousel-overlay h3 {
            font-size: 0.95rem;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 2px;
        }

        .carousel-overlay span {
            font-size: 0.75rem;
            color: #d0d0d0;
        }

        .carousel-nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            z-index: 25;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.25);
            background-color: rgba(20, 20, 20, 0.72);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.2s ease;
            backdrop-filter: blur(4px);
        }

        .carousel-nav-btn:hover {
            background-color: var(--accent);
            border-color: var(--accent);
        }

        .carousel-nav-btn:active {
            transform: translateY(-50%) scale(0.94);
        }

        .carousel-prev { left: 8px; }
        .carousel-next { right: 8px; }

        /* =========================================
           B. GENRE FILTER CHIPS
        ========================================= */
        .genre-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            overflow-x: auto;
            padding: 4px 0 12px;
            scrollbar-width: none;
            -ms-overflow-style: none;
            scroll-behavior: smooth;
        }

        .genre-bar::-webkit-scrollbar {
            display: none;
        }

        .genre-chip {
            flex-shrink: 0;
            min-height: 40px;
            padding: 8px 18px;
            border-radius: 999px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-secondary);
            color: var(--text-primary);
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }

        .genre-chip:active {
            transform: scale(0.96);
        }

        .genre-chip.active {
            background-color: var(--accent);
            border-color: var(--accent);
            color: #ffffff;
        }

        /* Section Heading (for Favorites / Filtered views) */
        .view-heading-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 4px 0 14px;
        }

        .view-heading {
            font-size: 1.15rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .view-heading i {
            color: var(--accent);
        }

        /* =========================================
           C. MOVIES GRID (2 / 4 / 5 COLUMNS)
        ========================================= */
        .movies-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
        }

        @media (min-width: 768px) {
            .movies-grid {
                grid-template-columns: repeat(4, 1fr);
                gap: 18px;
            }
        }

        @media (min-width: 1025px) {
            .movies-grid {
                grid-template-columns: repeat(5, 1fr);
                gap: 20px;
            }
        }

        .movie-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
            display: flex;
            flex-direction: column;
        }

        @media (hover: hover) {
            .movie-card:hover {
                transform: translateY(-6px);
                box-shadow: var(--shadow);
                border-color: var(--text-secondary);
            }
        }

        .movie-card:active {
            transform: scale(0.98);
        }

        .movie-poster-wrap {
            position: relative;
            width: 100%;
            aspect-ratio: 2 / 3;
            background-color: var(--bg-secondary);
            overflow: hidden;
        }

        .movie-poster-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .card-fav-indicator {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background-color: rgba(0, 0, 0, 0.65);
            color: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.82rem;
        }

        .movie-card-body {
            padding: 10px 12px 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
        }

        .movie-card-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text-primary);
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .movie-card-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            font-size: 0.78rem;
            color: var(--text-secondary);
        }

        .movie-card-rating {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            color: var(--star-color);
            font-weight: 600;
            flex-shrink: 0;
        }

        .movie-card-rating span.votes {
            color: var(--text-secondary);
            font-weight: 400;
        }

        /* Skeleton Loading Cards */
        .skeleton-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            overflow: hidden;
        }

        .skeleton-poster {
            width: 100%;
            aspect-ratio: 2 / 3;
            background: linear-gradient(90deg, var(--bg-secondary) 25%, var(--bg-card) 50%, var(--bg-secondary) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.3s infinite;
        }

        .skeleton-line {
            height: 12px;
            margin: 10px 12px;
            border-radius: 6px;
            background: linear-gradient(90deg, var(--bg-secondary) 25%, var(--bg-card) 50%, var(--bg-secondary) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.3s infinite;
        }

        .skeleton-line.short {
            width: 60%;
            margin-top: 6px;
            margin-bottom: 12px;
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* Empty State */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 48px 20px;
            border: 1px dashed var(--border-color);
            border-radius: var(--radius);
            color: var(--text-secondary);
        }

        .empty-state i {
            font-size: 2.6rem;
            margin-bottom: 12px;
            opacity: 0.65;
        }

        .empty-state p {
            font-size: 0.95rem;
            margin-bottom: 14px;
        }

        /* =========================================
           BUTTONS & INPUTS
        ========================================= */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 44px;
            padding: 10px 18px;
            border-radius: 8px;
            border: none;
            font-size: 0.92rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            text-decoration: none;
            transition: var(--transition);
            color: #ffffff;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-accent { background-color: var(--accent); }
        .btn-accent:hover:not(:disabled) { background-color: var(--accent-hover); }

        .btn-play { background-color: var(--blue); }
        .btn-play:hover:not(:disabled) { background-color: var(--blue-hover); }

        .btn-download { background-color: var(--green); }
        .btn-download:hover:not(:disabled) { background-color: var(--green-hover); }

        .btn-muted {
            background-color: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-muted:hover:not(:disabled) {
            border-color: var(--text-secondary);
        }

        .btn-muted.favorited {
            border-color: var(--accent);
            color: var(--accent);
        }

        /* =========================================
           D. MOVIE DETAIL MODAL & VIDEO PLAYER
        ========================================= */
        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 1000;
            background-color: rgba(0, 0, 0, 0.86);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            overflow-y: auto;
            backdrop-filter: blur(4px);
            animation: fadeIn 0.2s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-close-fixed {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 1050;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.25);
            background-color: rgba(20, 20, 20, 0.85);
            color: #ffffff;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s ease;
        }

        .modal-close-fixed:hover {
            background-color: var(--accent);
            border-color: var(--accent);
        }

        .detail-modal-card {
            width: 100%;
            max-width: 820px;
            max-height: 90vh;
            overflow-y: auto;
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            box-shadow: var(--shadow);
            margin: auto;
        }

        .detail-media-area {
            position: relative;
            background-color: #000000;
        }

        .detail-poster-container {
            display: flex;
            justify-content: center;
            background: radial-gradient(circle, rgba(229, 9, 20, 0.16), #0b0b0b 75%);
            padding: 20px;
        }

        .detail-poster-container img {
            width: 190px;
            max-width: 100%;
            aspect-ratio: 2 / 3;
            object-fit: cover;
            border-radius: 10px;
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.75);
        }

        /* Embedded 16:9 Video Player */
        .video-player-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: #000000;
        }

        .video-player-container iframe,
        .video-player-container video {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        .close-video-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 10;
            min-height: 36px;
            padding: 6px 12px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background-color: rgba(0, 0, 0, 0.78);
            color: #ffffff;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .close-video-btn:hover {
            background-color: var(--accent);
        }

        .detail-content {
            padding: 22px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .detail-title {
            font-size: 1.55rem;
            font-weight: 800;
            line-height: 1.25;
        }

        .detail-meta-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
        }

        .genre-badge {
            background-color: var(--accent);
            color: #ffffff;
            font-size: 0.78rem;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 999px;
        }

        .detail-rating-display {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .detail-rating-display i {
            color: var(--star-color);
        }

        .detail-description {
            color: var(--text-secondary);
            font-size: 0.95rem;
            line-height: 1.65;
            white-space: pre-line;
        }

        /* Star Rating Widget */
        .rate-movie-box {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px 16px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .rate-movie-label {
            font-size: 0.9rem;
            font-weight: 600;
        }

        .star-buttons {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .star-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.35rem;
            cursor: pointer;
            padding: 6px;
            min-width: 38px;
            min-height: 38px;
            transition: transform 0.15s ease, color 0.15s ease;
        }

        .star-btn:hover,
        .star-btn.active {
            color: var(--star-color);
            transform: scale(1.12);
        }

        .detail-actions-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        @media (max-width: 520px) {
            .detail-actions-grid {
                grid-template-columns: 1fr;
            }
        }

        /* =========================================
           E. SETTINGS MODAL & AUTH MODAL
        ========================================= */
        .sheet-modal-card {
            width: 100%;
            max-width: 480px;
            max-height: 88vh;
            overflow-y: auto;
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 22px;
            box-shadow: var(--shadow);
        }

        .modal-header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .modal-header-row h2 {
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .modal-header-row h2 i {
            color: var(--accent);
        }

        .modal-inline-close {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 1px solid var(--border-color);
            background-color: var(--bg-card);
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .settings-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .setting-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 14px;
        }

        .setting-card.clickable {
            cursor: pointer;
            transition: border-color 0.2s ease;
        }

        .setting-card.clickable:hover {
            border-color: var(--text-secondary);
        }

        .setting-left {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .setting-icon {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            background-color: rgba(229, 9, 20, 0.14);
            color: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            flex-shrink: 0;
        }

        .profile-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background-color: var(--accent);
            color: #ffffff;
            font-weight: 800;
            font-size: 1.05rem;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .setting-text h4 {
            font-size: 0.95rem;
            font-weight: 700;
        }

        .setting-text p {
            font-size: 0.8rem;
            color: var(--text-secondary);
            word-break: break-word;
        }

        /* Animated Theme Switch */
        .switch {
            position: relative;
            display: inline-block;
            width: 52px;
            height: 28px;
            flex-shrink: 0;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            inset: 0;
            background-color: #555;
            border-radius: 999px;
            transition: 0.3s;
        }

        .slider::before {
            position: absolute;
            content: "";
            height: 22px;
            width: 22px;
            left: 3px;
            bottom: 3px;
            background-color: #ffffff;
            border-radius: 50%;
            transition: 0.3s;
        }

        .switch input:checked + .slider {
            background-color: var(--accent);
        }

        .switch input:checked + .slider::before {
            transform: translateX(24px);
        }

        /* Auth Modal Tabs & Form */
        .auth-tabs {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            background-color: var(--bg-input);
            padding: 4px;
            border-radius: 10px;
            margin-bottom: 18px;
        }

        .auth-tab-btn {
            min-height: 40px;
            border: none;
            border-radius: 8px;
            background: transparent;
            color: var(--text-secondary);
            font-weight: 700;
            font-size: 0.92rem;
            cursor: pointer;
            transition: var(--transition);
        }

        .auth-tab-btn.active {
            background-color: var(--accent);
            color: #ffffff;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 14px;
        }

        .form-group label {
            font-size: 0.88rem;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            min-height: 44px;
            padding: 10px 14px;
            font-size: 16px;
            font-family: inherit;
            color: var(--text-primary);
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 8px;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .auth-error {
            background-color: rgba(231, 76, 60, 0.15);
            color: #e74c3c;
            border: 1px solid #e74c3c;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 0.86rem;
            margin-bottom: 14px;
        }

        /* =========================================
           BOTTOM NAVIGATION BAR
        ========================================= */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: var(--bottom-nav-height);
            background-color: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            z-index: 300;
            box-shadow: 0 -4px 16px rgba(0, 0, 0, 0.35);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 0.72rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            min-height: 44px;
            transition: color 0.2s ease;
        }

        .nav-item i {
            font-size: 1.2rem;
        }

        .nav-item.active {
            color: var(--accent);
        }

        /* =========================================
           TOAST NOTIFICATIONS
        ========================================= */
        #toastContainer {
            position: fixed;
            bottom: calc(var(--bottom-nav-height) + 14px);
            left: 50%;
            transform: translateX(-50%);
            z-index: 2000;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            width: calc(100% - 32px);
            max-width: 380px;
            pointer-events: none;
        }

        .toast {
            background-color: var(--bg-secondary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            border-left: 4px solid var(--accent);
            padding: 10px 16px;
            border-radius: 8px;
            box-shadow: var(--shadow);
            font-size: 0.88rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            animation: slideUpToast 0.25s ease;
        }

        .toast.success { border-left-color: var(--green); }
        .toast.error { border-left-color: #e74c3c; }

        @keyframes slideUpToast {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

                    <input type="password" id="signupConfirmPassword" required minlength="6" autocomplete="new-password" placeholder="Repeat password">

    <!-- Toast Notification Container -->
    <div id="toastContainer" aria-live="polite"></div>

    <script>
        /* =========================================================
           FIREBASE CONFIGURATION
        ========================================================= */
        const firebaseConfig = {
            apiKey: "AIzaSyDOXZG58pVwtqGs4UwghXP_U7ZZhpt4TCY",
            authDomain: "flixplay-movie.firebaseapp.com",
            databaseURL: "https://flixplay-movie-default-rtdb.firebaseio.com",
            projectId: "flixplay-movie",
            storageBucket: "flixplay-movie.firebasestorage.app",
            messagingSenderId: "1081716032192",
            appId: "1:1081716032192:web:7dac31b7024ab407c72325"
        };

        /* =========================================================
           GLOBAL VARIABLES
        ========================================================= */
        let auth = null;
        let database = null;
        let allMovies = [];
        let carouselMovies = [];
        let currentUser = null;
        let currentUserProfile = null;
        let activeMovie = null;

        let selectedGenre = 'All';
        let activeView = 'home'; // 'home' or 'favorites'
        let carouselIndex = 0;
        let carouselTimer = null;
        let touchStartX = 0;
        let touchEndX = 0;
        let searchDebounce = null;

        const DEFAULT_GENRES = [
            'All', 'Action', 'Comedy', 'Drama', 'Horror',
            'Sci-Fi', 'Romance', 'Thriller', 'Animation', 'Adventure', 'Fantasy'
        ];

        // Inline SVG fallback for broken posters
        const FALLBACK_POSTER = "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(
            `<svg xmlns="http://www.w3.org/2000/svg" width="300" height="450" viewBox="0 0 300 450">
                <rect width="300" height="450" fill="#1f1f1f"/>
                <text x="50%" y="50%" fill="#777" font-family="sans-serif" font-size="20" text-anchor="middle" dy=".3em">No Poster</text>
            </svg>`
        );

        /* =========================================================
           INITIALIZATION FUNCTIONS
        ========================================================= */
        function initializeFirebase() {
            const loadingScreen = document.getElementById('loadingScreen');

            renderSkeletonGrid();

            if (!firebaseConfig.apiKey || firebaseConfig.apiKey === "YOUR_API_KEY") {
                loadingScreen.classList.add('hidden');
                loadGenres();
                renderCarousel([]);
                displayMovies([]);
                showToast('Please configure Firebase credentials in index.html.', 'error');
                return;
            }

            try {
                if (!firebase.apps.length) {
                    firebase.initializeApp(firebaseConfig);
                }
                auth = firebase.auth();
                database = firebase.database();

                auth.onAuthStateChanged(async (user) => {
                    currentUser = user;
                    if (user) {
                        await loadUserProfile(user.uid);
                    } else {
                        currentUserProfile = null;
                    }
                    updateAccountUI();
                    if (activeMovie && !document.getElementById('movieDetailModal').classList.contains('hidden')) {
                        updateStarRatingUI();
                    }
                });

                loadMovies();
            } catch (error) {
                console.error("Firebase initialization failed:", error);
                loadingScreen.classList.add('hidden');
                displayMovies([]);
                showToast('Failed to connect to Firebase.', 'error');
            }
        }

        function initializeTheme() {
            const savedTheme = localStorage.getItem('theme') || 'dark';
            applyTheme(savedTheme);
        }

        /* =========================================================
           AUTHENTICATION FUNCTIONS
        ========================================================= */
        async function login(event) {
            event.preventDefault();
            hideAuthError();

            if (!auth) {
                showAuthError('Firebase is not configured yet.');
                return;
            }

            const email = document.getElementById('userLoginEmail').value.trim();
            const password = document.getElementById('userLoginPassword').value;
            const btn = document.getElementById('userLoginSubmitBtn');

            if (!email || !password) {
                showAuthError('Please enter your email and password.');
                return;
            }

            try {
                btn.disabled = true;
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i><span>Logging in...</span>';
                await auth.signInWithEmailAndPassword(email, password);
                closeAuthModal();
                document.getElementById('userLoginForm').reset();
                showToast('Welcome back!', 'success');
            } catch (error) {
                console.error("Login failed:", error);
                showAuthError(getFriendlyAuthError(error));
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-sign-in-alt"></i><span>Login</span>';
            }
        }

        async function signup(event) {
            event.preventDefault();
            hideAuthError();

            if (!auth || !database) {
                showAuthError('Firebase is not configured yet.');
                return;
            }

            const name = document.getElementById('signupName').value.trim();
            const email = document.getElementById('signupEmail').value.trim();
            const password = document.getElementById('signupPassword').value;
            const confirmPassword = document.getElementById('signupConfirmPassword').value;
            const btn = document.getElementById('userSignupSubmitBtn');

            if (!name || !email || !password || !confirmPassword) {
                showAuthError('All fields are required.');
                return;
            }

            if (password.length < 6) {
                showAuthError('Password must be at least 6 characters.');
                return;
            }

            if (password !== confirmPassword) {
                showAuthError('Passwords do not match.');
                return;
            }

            try {
                btn.disabled = true;
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i><span>Creating Account...</span>';

                const credential = await auth.createUserWithEmailAndPassword(email, password);
                const localFavIds = getLocalFavorites();

                const userData = {
                    name,
                    email,
                    createdAt: Date.now(),
                    favorites: localFavIds
                };

                await database.ref(`users/${credential.user.uid}`).set(userData);
                currentUserProfile = userData;

                closeAuthModal();
                document.getElementById('userSignupForm').reset();
                updateAccountUI();
                showToast('Account created successfully!', 'success');
            } catch (error) {
                console.error("Signup failed:", error);
                showAuthError(getFriendlyAuthError(error));
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-user-plus"></i><span>Create Account</span>';
            }
        }

        async function logout() {
            if (!auth) return;
            try {
                await auth.signOut();
                showToast('Logged out successfully.', 'success');
            } catch (error) {
                console.error("Logout failed:", error);
                showToast('Failed to log out.', 'error');
            }
        }

        async function loadUserProfile(uid) {
            if (!database) return;
            try {
                const snap = await database.ref(`users/${uid}`).once('value');
                currentUserProfile = snap.val() || {
                    name: currentUser?.email?.split('@')[0] || 'User',
                    email: currentUser?.email || '',
                    favorites: []
                };

                const remoteFavs = Array.isArray(currentUserProfile.favorites) ? currentUserProfile.favorites : [];
                const localFavs = getLocalFavorites();
                const mergedFavs = Array.from(new Set([...localFavs, ...remoteFavs]));
                localStorage.setItem('favorites', JSON.stringify(mergedFavs));
                if (mergedFavs.length !== remoteFavs.length) {
                    database.ref(`users/${uid}/favorites`).set(mergedFavs).catch(() => {});
                }
            } catch (error) {
                console.error("Error loading user profile:", error);
            }
        }

        /* =========================================================
           DATA LOADING FUNCTIONS
        ========================================================= */
        function loadMovies() {
            if (!database) return;

            database.ref('movies').on('value', (snapshot) => {
                document.getElementById('loadingScreen').classList.add('hidden');
                const data = snapshot.val();
                allMovies = [];

                if (data) {
                    Object.keys(data).forEach((key) => {
                        allMovies.push({ id: key, ...data[key] });
                    });
                    allMovies.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
                }

                syncOfflineFavoritesCache();

                if (activeMovie) {
                    const updated = allMovies.find(m => m.id === activeMovie.id);
                    if (updated) {
                        activeMovie = updated;
                        updateDetailRatingDisplay();
                    }
                }

                carouselMovies = allMovies.slice(0, 5);
                if (carouselIndex >= carouselMovies.length) carouselIndex = 0;
                renderCarousel(carouselMovies);

                loadGenres();
                filterMovies();
            }, (error) => {
                console.error("Failed to load movies:", error);
                document.getElementById('loadingScreen').classList.add('hidden');
                if (activeView === 'favorites') {
                    filterMovies();
                } else {
                    displayMovies([]);
                }
                showToast('Unable to fetch latest movies. Check your connection.', 'error');
            });
        }

        function loadGenres() {
            const container = document.getElementById('genreChipsContainer');
            const extraGenres = allMovies
                .map(m => m.genre)
                .filter(g => g && !DEFAULT_GENRES.includes(g));
            const genres = [...DEFAULT_GENRES, ...Array.from(new Set(extraGenres))];

            container.innerHTML = genres.map((genre) => {
                const isActive = genre === selectedGenre ? 'active' : '';
                return `<button type="button" class="genre-chip ${isActive}" data-genre="${escapeHtml(genre)}">${escapeHtml(genre)}</button>`;
            }).join('');
        }

        /* =========================================================
           UI FUNCTIONS (CAROUSEL, GRID, MODAL, VIDEO PLAYER)
        ========================================================= */
        function renderCarousel(movies) {
            const section = document.getElementById('carouselSection');
            const stage = document.getElementById('carouselStage');

            if (!movies || movies.length === 0 || activeView === 'favorites') {
                section.classList.add('hidden');
                stopCarouselAutoRotate();
                return;
            }

            section.classList.remove('hidden');

            const existingIds = Array.from(stage.children).map(el => el.dataset.id).join(',');
            const incomingIds = movies.map(m => m.id).join(',');

            if (existingIds !== incomingIds) {
                stage.innerHTML = movies.map((movie, idx) => {
                    const poster = isValidHttpUrl(movie.poster) ? escapeHtml(movie.poster) : FALLBACK_POSTER;
                    return `
                        <div class="carousel-item" data-id="${escapeHtml(movie.id)}" data-index="${idx}" role="button" tabindex="0" aria-label="View ${escapeHtml(movie.title)}">
                            <img src="${poster}" alt="${escapeHtml(movie.title)} poster" onerror="this.onerror=null;this.src='${FALLBACK_POSTER}';">
                            <div class="carousel-overlay">
                                <h3>${escapeHtml(movie.title || 'Untitled')}</h3>
                                <span>${escapeHtml(movie.genre || '')}</span>
                            </div>
                        </div>
                    `;
                }).join('');
            }

            updateCarouselPositions();
            startCarouselAutoRotate();
        }

        function updateCarouselPositions() {
            const stage = document.getElementById('carouselStage');
            const items = Array.from(stage.children);
            const total = items.length;
            if (total === 0) return;

            const isDesktop = window.innerWidth >= 768;
            const stepX1 = isDesktop ? 155 : 105;
            const stepX2 = isDesktop ? 275 : 175;

            items.forEach((item, i) => {
                let offset = i - carouselIndex;
                if (offset > total / 2) offset -= total;
                if (offset < -total / 2) offset += total;

                let transform = '';
                let zIndex = 1;
                let opacity = 0;

                if (offset === 0) {
                    transform = 'translate3d(0, 0, 120px) rotateY(0deg) scale(1)';
                    zIndex = 10;
                    opacity = 1;
                } else if (offset === 1 || (total === 2 && offset === -1)) {
                    const dir = offset > 0 ? 1 : -1;
                    transform = `translate3d(${dir * stepX1}px, 0, -10px) rotateY(${-dir * 25}deg) scale(0.84)`;
                    zIndex = 7;
                    opacity = 0.78;
                } else if (offset === -1) {
                    transform = `translate3d(${-stepX1}px, 0, -10px) rotateY(25deg) scale(0.84)`;
                    zIndex = 7;
                    opacity = 0.78;
                } else if (offset >= 2) {
                    transform = `translate3d(${stepX2}px, 0, -140px) rotateY(-40deg) scale(0.68)`;
                    zIndex = 4;
                    opacity = 0.42;
                } else {
                    transform = `translate3d(${-stepX2}px, 0, -140px) rotateY(40deg) scale(0.68)`;
                    zIndex = 4;
                    opacity = 0.42;
                }

                item.style.transform = transform;
                item.style.zIndex = zIndex;
                item.style.opacity = opacity;
            });
        }

        function rotateCarousel(direction) {
            if (carouselMovies.length <= 1) return;
            carouselIndex = (carouselIndex + direction + carouselMovies.length) % carouselMovies.length;
            updateCarouselPositions();
            startCarouselAutoRotate();
        }

        function startCarouselAutoRotate() {
            stopCarouselAutoRotate();
            if (carouselMovies.length <= 1 || activeView !== 'home') return;
            carouselTimer = setInterval(() => {
                carouselIndex = (carouselIndex + 1) % carouselMovies.length;
                updateCarouselPositions();
            }, 4000);
        }

        function stopCarouselAutoRotate() {
            if (carouselTimer) {
                clearInterval(carouselTimer);
                carouselTimer = null;
            }
        }

        /* =========================================================
           RATING, FAVORITES & REPORTING
        ========================================================= */
        async function rateMovie(stars) {
            if (!activeMovie) return;

            if (!currentUser) {
                showToast('Please sign in to rate movies.', 'error');
                openAuthModal('login');
                return;
            }

            if (!database) return;

            const movieId = activeMovie.id;
            const uid = currentUser.uid;
            const userRatingRef = database.ref(`users/${uid}/ratings/${movieId}`);
            const movieRef = database.ref(`movies/${movieId}`);

            try {
                const prevSnap = await userRatingRef.once('value');
                const previousRating = prevSnap.val();

                await movieRef.transaction((movieData) => {
                    if (!movieData) return movieData;
                    const currentTotal = typeof movieData.ratingTotal === 'number' ? movieData.ratingTotal : 0;
                    const currentCount = typeof movieData.ratingCount === 'number' ? movieData.ratingCount : 0;

                    if (typeof previousRating === 'number') {
                        movieData.ratingTotal = currentTotal - previousRating + stars;
                    } else {
                        movieData.ratingTotal = currentTotal + stars;
                        movieData.ratingCount = currentCount + 1;
                    }
                    return movieData;
                });

                await userRatingRef.set(stars);
                if (!currentUserProfile) currentUserProfile = {};
                if (!currentUserProfile.ratings) currentUserProfile.ratings = {};
                currentUserProfile.ratings[movieId] = stars;

                updateStarRatingUI();
                showToast(`Rated ${stars} star${stars > 1 ? 's' : ''}!`, 'success');
            } catch (error) {
                console.error("Rating error:", error);
                showToast('Failed to submit rating.', 'error');
            }
        }

        function updateDetailRatingDisplay() {
            if (!activeMovie) return;
            const avg = activeMovie.ratingCount > 0
                ? (activeMovie.ratingTotal / activeMovie.ratingCount).toFixed(1)
                : '0.0';
            const votes = activeMovie.ratingCount || 0;
            document.getElementById('detailRatingText').textContent = `${avg} (${votes} vote${votes === 1 ? '' : 's'})`;
        }

        function updateStarRatingUI() {
            const userRating = (activeMovie && currentUserProfile?.ratings?.[activeMovie.id]) || 0;
            document.getElementById('ratePromptLabel').textContent = userRating
                ? `Your rating (${userRating}/5):`
                : 'Rate this movie:';

            document.querySelectorAll('#starButtonsGroup .star-btn').forEach((btn) => {
                const val = Number(btn.dataset.star);
                btn.classList.toggle('active', val <= userRating);
            });
        }

        function toggleFavorite() {
            if (!activeMovie) return;

            let favIds = getLocalFavorites();
            let favCache = getOfflineFavoritesCache();
            const exists = favIds.includes(activeMovie.id);

            if (exists) {
                favIds = favIds.filter(id => id !== activeMovie.id);
                delete favCache[activeMovie.id];
                showToast('Removed from Favorites.', 'success');
            } else {
                favIds.push(activeMovie.id);
                favCache[activeMovie.id] = activeMovie;
                showToast('Saved to Favorites!', 'success');
            }

            localStorage.setItem('favorites', JSON.stringify(favIds));
            localStorage.setItem('favoritesData', JSON.stringify(favCache));

            if (currentUser && database) {
                database.ref(`users/${currentUser.uid}/favorites`).set(favIds).catch(() => {});
            }

            updateFavoriteButtonUI();
            updateSettingsFavCount();
            filterMovies();
        }

            if (!activeMovie) return;

            if (!database) {
                showToast('Unable to send report while offline.', 'error');

            btn.disabled = true;

                showToast('Failed to submit report.', 'error');
            } finally {
                btn.disabled = false;
            }
        }

        /* =========================================================
           HELPER FUNCTIONS
        ========================================================= */
        function convertToEmbedUrl(url) {
            try {
                const parsed = new URL(url);
                const host = parsed.hostname.replace(/^www\./, '').toLowerCase();

                if ((host === 'youtube.com' || host === 'm.youtube.com') && parsed.searchParams.get('v')) {
                    const videoId = parsed.searchParams.get('v');
                    return `https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0`;
                }

                if (host === 'youtube.com' || host === 'm.youtube.com') {
                    if (parsed.pathname.startsWith('/shorts/')) {
                        const videoId = parsed.pathname.split('/')[2];
                        return `https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0`;
                    }
                    if (parsed.pathname.startsWith('/embed/')) {
                        parsed.searchParams.set('autoplay', '1');
                        return parsed.toString();
                    }
                }

                if (host === 'youtu.be') {
                    const videoId = parsed.pathname.replace('/', '');
                    return `https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0`;
                }

                if (host === 'vimeo.com') {
                    const videoId = parsed.pathname.split('/').filter(Boolean)[0];
                    if (videoId) {
                        return `https://player.vimeo.com/video/${videoId}?autoplay=1`;
                    }
                }

                if (host === 'dailymotion.com') {
                    const match = parsed.pathname.match(/\/video\/([^_\/]+)/);
                    if (match && match[1]) {
                        return `https://www.dailymotion.com/embed/video/${match[1]}?autoplay=1`;
                    }
                }
                if (host === 'dai.ly') {
                    const videoId = parsed.pathname.replace('/', '');
                    if (videoId) {
                        return `https://www.dailymotion.com/embed/video/${videoId}?autoplay=1`;
                    }
                }

                return url;
            } catch {
                return url;
            }
        }

        function filterMovies() {
            const searchQuery = document.getElementById('searchInput').value.trim().toLowerCase();
            const headingBar = document.getElementById('viewHeadingBar');
            const headingText = document.getElementById('viewHeadingText');
            const carouselSection = document.getElementById('carouselSection');
            const genreBar = document.getElementById('genreChipsContainer');

            let sourceList = allMovies;

            if (activeView === 'favorites') {
                const favIds = getLocalFavorites();
                const offlineCache = getOfflineFavoritesCache();
                sourceList = favIds.map(id => allMovies.find(m => m.id === id) || offlineCache[id]).filter(Boolean);

                carouselSection.classList.add('hidden');
                genreBar.classList.add('hidden');
                headingBar.classList.remove('hidden');
                headingText.innerHTML = `<i class="fas fa-heart"></i> My Favorites (${sourceList.length})`;
                stopCarouselAutoRotate();
            } else {
                genreBar.classList.remove('hidden');
                if (carouselMovies.length > 0 && !searchQuery && selectedGenre === 'All') {
                    carouselSection.classList.remove('hidden');
                    startCarouselAutoRotate();
                } else {
                    carouselSection.classList.add('hidden');
                    stopCarouselAutoRotate();
                }

                if (searchQuery) {
                    headingBar.classList.remove('hidden');
                    headingText.innerHTML = `<i class="fas fa-search"></i> Search Results`;
                } else {
                    headingBar.classList.add('hidden');
                }
            }

            const filtered = sourceList.filter((movie) => {
                const matchesGenre = activeView === 'favorites' || selectedGenre === 'All' || movie.genre === selectedGenre;
                const matchesSearch = !searchQuery ||
                    (movie.title || '').toLowerCase().includes(searchQuery) ||
                    (movie.genre || '').toLowerCase().includes(searchQuery) ||
                    (movie.description || '').toLowerCase().includes(searchQuery);
                return matchesGenre && matchesSearch;
            });

            displayMovies(filtered);
        }

        function getLocalFavorites() {
            try {
                const parsed = JSON.parse(localStorage.getItem('favorites') || '[]');
                return Array.isArray(parsed) ? parsed : [];
            } catch {
                return [];
            }
        }

        function getOfflineFavoritesCache() {
            try {
                const parsed = JSON.parse(localStorage.getItem('favoritesData') || '{}');
                return parsed && typeof parsed === 'object' ? parsed : {};
            } catch {
                return {};
            }
        }

        function syncOfflineFavoritesCache() {
            const favIds = getLocalFavorites();
            const cache = getOfflineFavoritesCache();
            favIds.forEach((id) => {
                const found = allMovies.find(m => m.id === id);
                if (found) cache[id] = found;
            });
            localStorage.setItem('favoritesData', JSON.stringify(cache));
            updateSettingsFavCount();
        }

        function updateSettingsFavCount() {
            document.getElementById('settingsFavCount').textContent = getLocalFavorites().length;
        }

        function isValidHttpUrl(str) {
            try {
                const u = new URL(str);
                return u.protocol === 'http:' || u.protocol === 'https:';
            } catch {
                return false;
            }
        }

        function escapeHtml(text) {
            if (text === null || text === undefined) return '';
            return String(text)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function showAuthError(msg) {
            const box = document.getElementById('authErrorBox');
            box.textContent = msg;
            box.classList.remove('hidden');
        }

        function hideAuthError() {
            const box = document.getElementById('authErrorBox');
            box.classList.add('hidden');
            box.textContent = '';
        }

        function getFriendlyAuthError(error) {
            switch (error.code) {
                case 'auth/email-already-in-use':
                    return 'This email is already registered.';
                case 'auth/invalid-email':
                    return 'Please enter a valid email address.';
                case 'auth/weak-password':
                    return 'Password should be at least 6 characters.';
                case 'auth/user-not-found':
                case 'auth/wrong-password':
                case 'auth/invalid-credential':
                    return 'Invalid email or password.';
                default:
                    return error.message || 'Authentication failed.';
            }
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            const iconClass = type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle';
            toast.innerHTML = `<i class="fas ${iconClass}" aria-hidden="true"></i><span>${escapeHtml(message)}</span>`;
            container.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(10px)';
                toast.style.transition = 'all 0.25s ease';
                setTimeout(() => toast.remove(), 250);
            }, 3000);
        }

        /* =========================================================
           EVENT LISTENERS
        ========================================================= */
        window.addEventListener('DOMContentLoaded', () => {
            initializeTheme();
            initializeFirebase();

            document.getElementById('brandHomeBtn').addEventListener('click', resetToHomeView);

            document.getElementById('searchInput').addEventListener('input', () => {
                clearTimeout(searchDebounce);
                searchDebounce = setTimeout(filterMovies, 180);
            });

            document.getElementById('carouselPrevBtn').addEventListener('click', () => rotateCarousel(-1));
            document.getElementById('carouselNextBtn').addEventListener('click', () => rotateCarousel(1));

            const carouselStage = document.getElementById('carouselStage');
            carouselStage.addEventListener('click', (e) => {
                const item = e.target.closest('.carousel-item');
                if (!item) return;
                const movie = allMovies.find(m => m.id === item.dataset.id);
                if (movie) openMovieDetail(movie);
            });

            const carouselSection = document.getElementById('carouselSection');
            carouselSection.addEventListener('touchstart', (e) => {
                touchStartX = e.changedTouches[0].screenX;
                stopCarouselAutoRotate();
            }, { passive: true });

            carouselSection.addEventListener('touchend', (e) => {
                touchEndX = e.changedTouches[0].screenX;
                const deltaX = touchEndX - touchStartX;
                if (Math.abs(deltaX) > 40) {
                    rotateCarousel(deltaX < 0 ? 1 : -1);
                } else {
                    startCarouselAutoRotate();
                }
            }, { passive: true });

            window.addEventListener('resize', updateCarouselPositions);

            document.getElementById('genreChipsContainer').addEventListener('click', (e) => {
                const chip = e.target.closest('.genre-chip');
                if (!chip) return;
                selectedGenre = chip.dataset.genre;
                activeView = 'home';
                setActiveBottomNav('home');
                loadGenres();
                filterMovies();
            });

            document.getElementById('moviesGrid').addEventListener('click', (e) => {
                const card = e.target.closest('.movie-card');
                if (!card) return;
                const movie = allMovies.find(m => m.id === card.dataset.movieId)
                    || getOfflineFavoritesCache()[card.dataset.movieId];
                if (movie) openMovieDetail(movie);
            });

            document.getElementById('closeDetailModalBtn').addEventListener('click', closeMovieDetail);
            document.getElementById('movieDetailModal').addEventListener('click', (e) => {
                if (e.target.id === 'movieDetailModal') closeMovieDetail();
            });
            document.getElementById('playNowBtn').addEventListener('click', () => {
                if (activeMovie?.playUrl) playMovie(activeMovie.playUrl);
            });
            document.getElementById('closeVideoPlayerBtn').addEventListener('click', closeVideoPlayer);
            document.getElementById('toggleFavoriteBtn').addEventListener('click', toggleFavorite);
            document.getElementById('reportBrokenBtn').addEventListener('click', reportBrokenLink);

            document.getElementById('starButtonsGroup').addEventListener('click', (e) => {
                const starBtn = e.target.closest('.star-btn');
                if (!starBtn) return;
                rateMovie(Number(starBtn.dataset.star));
            });

            document.querySelectorAll('.bottom-nav .nav-item').forEach((btn) => {
                btn.addEventListener('click', () => {
                    const target = btn.dataset.nav;
                    if (target === 'home') {
                        resetToHomeView();
                    } else if (target === 'search') {
                        setActiveBottomNav('search');
                        const searchEl = document.getElementById('searchInput');
                        searchEl.focus();
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                    } else if (target === 'favorites') {
                        activeView = 'favorites';
                        setActiveBottomNav('favorites');
                        filterMovies();
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                    } else if (target === 'settings') {
                        setActiveBottomNav('settings');
                        openSettingsModal();
                    }
                });
            });

            document.getElementById('closeSettingsBtn').addEventListener('click', closeSettingsModal);
            document.getElementById('settingsModal').addEventListener('click', (e) => {
                if (e.target.id === 'settingsModal') closeSettingsModal();
            });
            document.getElementById('settingsThemeToggle').addEventListener('change', (e) => {
                const nextTheme = e.target.checked ? 'dark' : 'light';
                applyTheme(nextTheme);
                localStorage.setItem('theme', nextTheme);
            });
            document.getElementById('settingsFavoritesCard').addEventListener('click', () => {
                closeSettingsModal();
                activeView = 'favorites';
                setActiveBottomNav('favorites');
                filterMovies();
            });

            document.getElementById('closeAuthModalBtn').addEventListener('click', closeAuthModal);
            document.getElementById('authModal').addEventListener('click', (e) => {
                if (e.target.id === 'authModal') closeAuthModal();
            });
            document.getElementById('tabLoginBtn').addEventListener('click', () => switchAuthTab('login'));
            document.getElementById('tabSignupBtn').addEventListener('click', () => switchAuthTab('signup'));
            document.getElementById('userLoginForm').addEventListener('submit', login);
            document.getElementById('userSignupForm').addEventListener('submit', signup);

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    if (!document.getElementById('movieDetailModal').classList.contains('hidden')) {
                        closeMovieDetail();
                    } else if (!document.getElementById('authModal').classList.contains('hidden')) {
                        closeAuthModal();
                    } else if (!document.getElementById('settingsModal').classList.contains('hidden')) {
                        closeSettingsModal();
                    }
                }
            });
        });
    </script>
</body>
</html>
